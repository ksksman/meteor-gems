<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<title>별똥별 보석 사냥</title>
<style>
  :root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sar:env(safe-area-inset-right,0px)}
  html,body{margin:0;height:100%;background:#070b1a;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#fff}
  canvas{display:block;position:fixed;left:0;top:0}
  #overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;background:rgba(5,8,22,.74);padding:16px;box-sizing:border-box;gap:10px}
  #overlay.hidden{display:none}
  #overlay h1{margin:0 0 4px;font-size:clamp(30px,8vw,56px);letter-spacing:-1px;
    background:linear-gradient(90deg,#7ef3ff,#c9a6ff,#ffd27e);-webkit-background-clip:text;background-clip:text;color:transparent}
  #overlay p{margin:0;opacity:.85;line-height:1.6;font-size:clamp(14px,3.6vw,17px)}
  #overlay .score{font-size:clamp(22px,6vw,34px);font-weight:700;opacity:1}
  #overlay button{margin-top:14px;font:inherit;font-size:20px;font-weight:700;color:#071022;border:0;border-radius:999px;
    padding:14px 42px;background:linear-gradient(90deg,#7ef3ff,#b9a0ff);cursor:pointer;box-shadow:0 6px 24px rgba(126,243,255,.35)}
  #overlay button:active{transform:scale(.96)}
  .help-touch{display:none} body.touch .help-touch{display:block} body.touch .help-key{display:none}
  #shieldBtn{--p:0;position:fixed;z-index:5;display:none;right:calc(16px + var(--sar));bottom:calc(16px + var(--sab));
    width:84px;height:84px;border-radius:50%;border:3px solid rgba(255,255,255,.55);padding:0;
    background:conic-gradient(rgba(12,18,40,.88) calc(var(--p)*360deg),rgba(63,208,255,.95) 0);touch-action:none}
  #shieldBtn.ready{box-shadow:0 0 22px rgba(63,208,255,.8)}
  #shieldBtn span{position:absolute;inset:9px;border-radius:50%;background:rgba(7,11,26,.82);display:flex;
    align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}
  body.touch #shieldBtn{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="shieldBtn" aria-label="무적"><span id="shieldLbl">무적</span></button>
<div id="overlay">
  <h1>별똥별 보석 사냥</h1>
  <div id="ovBody">
    <p>쏟아지는 운석을 피하며 보석을 모으세요.<br>보석을 다 모으면 다음 스테이지!</p>
    <p class="help-key">이동: 방향키 / WASD · 무적: Space</p>
    <p class="help-touch">드래그하면 우주선이 손가락을 따라와요<br>오른쪽 아래 버튼: 3초 무적</p>
  </div>
  <button id="startBtn">시작</button>
</div>
<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const overlay = document.getElementById('overlay'), ovBody = document.getElementById('ovBody');
const startBtn = document.getElementById('startBtn');
const shieldBtn = document.getElementById('shieldBtn'), shieldLbl = document.getElementById('shieldLbl');

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const SPEED = 52, SHIELD_DUR = 3, SHIELD_CD = 12, HURT_DUR = 1.6, MAX_LIVES = 5;

let W = 0, H = 0, U = 1, DPR = 1, SAT = 0;
const player = { x: 0, y: 0, ru: 3, tilt: 0 };
let meteors = [], gems = [], parts = [], floats = [];
let state = 'menu', stage = 1, score = 0, lives = 3, gemsGot = 0, gemsNeed = 0;
let spawnT = 0, hurtT = 0, shieldT = 0, shieldCD = 0, clearT = 0, bannerT = 0, banner = '', subBanner = '';
let shake = 0, overT = 0, time = 0;
let best = 0;
try { best = +localStorage.getItem('meteorGemsBest') || 0; } catch (e) {}

const stars = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), z: rand(.2, 1) }));

// ---------- 화면 크기 ----------
function resize() {
  const oW = W, oH = H;
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = Math.min(W, H) / 100;
  SAT = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
  if (oW && oH) {
    const sx = W / oW, sy = H / oH;
    for (const o of [player, ...meteors, ...gems]) { o.x *= sx; o.y *= sy; }
  }
}
window.addEventListener('resize', resize);
resize();

// ---------- 스테이지 난이도 ----------
function cfg(s) {
  return {
    max: Math.min(4 + s * 2, 34),                 // 동시에 존재하는 운석 수
    speed: Math.min(15 + s * 3.5, 62),            // 운석 속도 (U/s)
    interval: Math.max(0.2, 1.1 - s * 0.09),      // 생성 간격
    homing: s >= 3 ? Math.min(0.45, 0.2 + (s - 3) * 0.06) : 0, // 추적형 비율
    turn: Math.min(2.4, 1.2 + (s - 3) * 0.15),    // 추적 회전력
    need: 4 + s,                                   // 필요한 보석 수
  };
}

function makeShape() {
  const n = 9, pts = [];
  for (let i = 0; i < n; i++) pts.push(rand(.72, 1.08));
  return pts;
}

function spawnMeteor() {
  const c = cfg(stage), m = 12 * U;
  const r = Math.random();
  const side = r < .45 ? 0 : r < .62 ? 1 : r < .79 ? 3 : 2; // 위쪽에서 많이
  let x, y;
  if (side === 0) { x = rand(0, W); y = -m; }
  else if (side === 1) { x = W + m; y = rand(0, H); }
  else if (side === 2) { x = rand(0, W); y = H + m; }
  else { x = -m; y = rand(0, H); }
  const homing = Math.random() < c.homing || (c.homing > 0 && !meteors.some(o => o.homing) && Math.random() < .5);
  const tx = homing ? player.x : rand(W * .15, W * .85), ty = homing ? player.y : rand(H * .15, H * .85);
  const sp = c.speed * rand(.75, 1.25) * (homing ? .62 : 1);
  const a = Math.atan2(ty - y, tx - x);
  meteors.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, sp, homing,
    ru: homing ? rand(2.5, 3.2) : rand(2.3, 5.4), life: homing ? rand(5, 7.5) : 0,
    rot: rand(0, 6.28), spin: rand(-2.5, 2.5), shape: makeShape(), age: 0 });
}

function spawnGem() {
  const mx = 8 * U, top = SAT + 12 * U;
  let x, y, tries = 0;
  do {
    x = rand(mx, W - mx); y = rand(top, H - mx);
    tries++;
  } while (Math.hypot(x - player.x, y - player.y) < 28 * U && tries < 30);
  gems.push({ x, y, ru: 2.6, t: 0 });
}

function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), s = rand(.3, 1) * spd;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.4, .9), max: .9, color, size: rand(.4, 1.1) });
  }
}
function floatText(x, y, text, color) { floats.push({ x, y, text, color, t: 0 }); }

// ---------- 게임 흐름 ----------
function startGame() {
  stage = 1; score = 0; lives = 3; shieldCD = 0; shieldT = 0; hurtT = 0;
  player.x = W / 2; player.y = H * .7; player.tilt = 0;
  meteors = []; gems = []; parts = []; floats = [];
  startStage();
  state = 'play';
  overlay.classList.add('hidden');
}

function startStage() {
  gemsGot = 0; gemsNeed = cfg(stage).need; spawnT = .8; clearT = 0;
  gems = []; spawnGem();
  banner = 'STAGE ' + stage; bannerT = 1.8;
  subBanner = stage === 3 ? '⚠ 추적 운석 등장!' : (stage > 3 && stage % 3 === 0 ? '운석이 더 빨라집니다' : '');
}

function clearStage() {
  const bonus = 50 * stage;
  score += bonus;
  floatText(W / 2, H / 2 + 8 * U, '+' + bonus + ' 클리어 보너스', '#ffd27e');
  for (const m of meteors) burst(m.x, m.y, m.homing ? '#ff5fd2' : '#ffa45c', 8, 30 * U);
  meteors = []; gems = [];
  if (stage % 3 === 0 && lives < MAX_LIVES) { lives++; floatText(player.x, player.y - 8 * U, '+1 ❤', '#ff6b8b'); }
  clearT = 1.8; banner = 'STAGE ' + stage + ' CLEAR!'; bannerT = 1.8; subBanner = '';
}

function gameOver() {
  state = 'over'; overT = 0;
  burst(player.x, player.y, '#7ef3ff', 40, 50 * U);
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('meteorGemsBest', String(best)); } catch (e) {} }
  setTimeout(() => {
    ovBody.innerHTML = `<p>GAME OVER</p><p class="score">${score.toLocaleString()}점</p>
      <p>스테이지 ${stage} 도달${isBest ? ' · 🏆 최고 기록!' : ' · 최고 ' + best.toLocaleString() + '점'}</p>`;
    startBtn.textContent = '다시 하기';
    overlay.classList.remove('hidden');
  }, 900);
}

function activateShield() {
  if (state !== 'play' || shieldCD > 0) return;
  shieldT = SHIELD_DUR; shieldCD = SHIELD_CD;
  burst(player.x, player.y, '#3fd0ff', 18, 30 * U);
}

function hitPlayer(m) {
  lives--; hurtT = HURT_DUR; shake = .35;
  burst(m.x, m.y, '#ffa45c', 20, 40 * U);
  if (navigator.vibrate) try { navigator.vibrate(120); } catch (e) {}
  if (lives <= 0) gameOver();
}

// ---------- 입력: 키보드 (e.code 기준이라 한/영 상태 무관) ----------
const keys = { u: false, d: false, l: false, r: false };
const CODE = { ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r' };
const KEY = { 'ㅈ': 'u', 'ㄴ': 'd', 'ㅁ': 'l', 'ㅇ': 'r', w: 'u', s: 'd', a: 'l', d: 'r', W: 'u', S: 'd', A: 'l', D: 'r' };
window.addEventListener('keydown', e => {
  const dir = CODE[e.code] || KEY[e.key];
  if (dir) { keys[dir] = true; e.preventDefault(); return; }
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter' || e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    if (state === 'menu' || (state === 'over' && !overlay.classList.contains('hidden'))) startGame();
    else if (state === 'play' && (e.code === 'Space' || e.key === ' ')) activateShield();
  }
});
window.addEventListener('keyup', e => {
  const dir = CODE[e.code] || KEY[e.key];
  if (dir) keys[dir] = false;
});
window.addEventListener('blur', () => { keys.u = keys.d = keys.l = keys.r = false; drag.active = false; });

// ---------- 입력: 터치/마우스 드래그 ----------
const drag = { active: false, id: null, x: 0, y: 0, off: 0 };
function markTouch() { document.body.classList.add('touch'); }
if ('ontouchstart' in window || navigator.maxTouchPoints > 0 && matchMedia('(hover: none)').matches || (window.matchMedia && matchMedia('(pointer: coarse)').matches)) markTouch();

cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') markTouch();
  if (drag.active) return;
  drag.active = true; drag.id = e.pointerId;
  drag.off = e.pointerType === 'touch' ? 7 * U : 0; // 손가락에 가리지 않게 살짝 위로
  drag.x = e.clientX; drag.y = e.clientY - drag.off;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (!drag.active || e.pointerId !== drag.id) return;
  drag.x = e.clientX; drag.y = e.clientY - drag.off;
});
const endDrag = e => { if (e.pointerId === drag.id) { drag.active = false; drag.id = null; } };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

shieldBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); activateShield(); });
shieldBtn.addEventListener('contextmenu', e => e.preventDefault());
startBtn.addEventListener('click', () => startGame());
document.addEventListener('gesturestart', e => e.preventDefault());

// ---------- 업데이트 ----------
function update(dt) {
  time += dt;
  for (const s of stars) { s.y += s.z * dt * .04 * (1 + stage * .08); if (s.y > 1) { s.y -= 1; s.x = Math.random(); } }

  // 파티클/텍스트
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) f.t += dt;
  floats = floats.filter(f => f.t < 1.2);
  shake = Math.max(0, shake - dt);
  bannerT = Math.max(0, bannerT - dt);

  if (state === 'over') { overT += dt; return; }
  if (state !== 'play') return;

  hurtT = Math.max(0, hurtT - dt);
  shieldT = Math.max(0, shieldT - dt);
  shieldCD = Math.max(0, shieldCD - dt);

  // 플레이어 이동
  const ox = player.x;
  let ix = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), iy = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
  if (ix || iy) {
    const l = Math.hypot(ix, iy);
    player.x += ix / l * SPEED * U * dt; player.y += iy / l * SPEED * U * dt;
  } else if (drag.active) {
    const dx = drag.x - player.x, dy = drag.y - player.y, d = Math.hypot(dx, dy);
    const step = SPEED * 1.6 * U * dt;
    if (d > .5) { const k = Math.min(d, step) / d; player.x += dx * k; player.y += dy * k; }
  }
  const pr = player.ru * U;
  player.x = clamp(player.x, pr, W - pr);
  player.y = clamp(player.y, pr + SAT, H - pr);
  const vxn = dt > 0 ? (player.x - ox) / dt / (SPEED * U) : 0;
  player.tilt += (clamp(vxn, -1.5, 1.5) * .35 - player.tilt) * Math.min(1, dt * 10);

  // 스테이지 클리어 대기
  if (clearT > 0) {
    clearT -= dt;
    if (clearT <= 0) { stage++; startStage(); }
    return;
  }

  // 운석 생성
  const c = cfg(stage);
  spawnT -= dt;
  if (spawnT <= 0 && meteors.length < c.max) { spawnMeteor(); spawnT = c.interval * rand(.6, 1.3); }

  // 운석 이동
  const invul = shieldT > 0 || hurtT > 0;
  for (const m of meteors) {
    m.age += dt;
    if (m.homing && m.life > 0) {
      m.life -= dt;
      let a = Math.atan2(m.vy, m.vx);
      let d = Math.atan2(player.y - m.y, player.x - m.x) - a;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      a += clamp(d, -c.turn * dt, c.turn * dt);
      m.vx = Math.cos(a) * m.sp; m.vy = Math.sin(a) * m.sp;
    }
    m.x += m.vx * U * dt; m.y += m.vy * U * dt; m.rot += m.spin * dt;
    if (m.homing && m.life > 0 && Math.random() < dt * 30)
      parts.push({ x: m.x, y: m.y, vx: rand(-3, 3) * U, vy: rand(-3, 3) * U, life: .35, max: .35, color: '#ff5fd2', size: .6 });

    const hitD = Math.hypot(m.x - player.x, m.y - player.y);
    if (hitD < pr * .8 + m.ru * U * .85) {
      if (shieldT > 0) {
        m.dead = true; score += 5; burst(m.x, m.y, '#3fd0ff', 12, 35 * U);
        floatText(m.x, m.y, '+5', '#7ef3ff');
      } else if (!invul) {
        m.dead = true; hitPlayer(m);
        if (state !== 'play') return;
      }
    }
    const mg = 20 * U;
    if (m.age > 1.5 && (m.x < -mg || m.x > W + mg || m.y < -mg || m.y > H + mg)) m.dead = true;
  }
  meteors = meteors.filter(m => !m.dead);

  // 보석
  for (const g of gems) {
    g.t += dt;
    if (Math.hypot(g.x - player.x, g.y - player.y) < pr + g.ru * U * 1.2) {
      g.dead = true; gemsGot++;
      const pts = 10 * stage; score += pts;
      burst(g.x, g.y, '#7ef3ff', 16, 30 * U);
      floatText(g.x, g.y, '+' + pts, '#7ef3ff');
    }
  }
  gems = gems.filter(g => !g.dead);
  if (gemsGot >= gemsNeed) { clearStage(); return; }
  const want = Math.min(stage >= 4 ? 2 : 1, gemsNeed - gemsGot);
  while (gems.length < want) spawnGem();
}

// ---------- 그리기 ----------
function drawHeart(x, y, s, fill) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, .35);
  ctx.bezierCurveTo(-.1, .25, -.5, 0, -.5, -.2);
  ctx.bezierCurveTo(-.5, -.45, -.15, -.55, 0, -.3);
  ctx.bezierCurveTo(.15, -.55, .5, -.45, .5, -.2);
  ctx.bezierCurveTo(.5, 0, .1, .25, 0, .35);
  ctx.fillStyle = fill ? '#ff5d7e' : 'rgba(255,255,255,.18)'; ctx.fill();
  ctx.restore();
}

function drawGem(g) {
  const r = g.ru * U * (1 + Math.sin(g.t * 5) * .08), x = g.x, y = g.y;
  const pop = Math.min(1, g.t * 4);
  ctx.save(); ctx.translate(x, y); ctx.scale(pop, pop);
  const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.6);
  glow.addColorStop(0, 'rgba(126,243,255,.45)'); glow.addColorStop(1, 'rgba(126,243,255,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, r * 2.6, 0, 6.28); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, -r); ctx.lineTo(r * .8, -r * .25); ctx.lineTo(0, r); ctx.lineTo(-r * .8, -r * .25); ctx.closePath();
  const gr = ctx.createLinearGradient(-r, -r, r, r);
  gr.addColorStop(0, '#e6fdff'); gr.addColorStop(.5, '#5fe3ff'); gr.addColorStop(1, '#8f6bff');
  ctx.fillStyle = gr; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = Math.max(1, r * .08); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r * .8, -r * .25); ctx.lineTo(r * .8, -r * .25); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
  ctx.restore();
}

function drawMeteor(m) {
  const r = m.ru * U, sp = Math.hypot(m.vx, m.vy) || 1;
  const nx = -m.vx / sp, ny = -m.vy / sp, len = r * (m.homing ? 3.5 : 3);
  const trail = ctx.createLinearGradient(m.x, m.y, m.x + nx * len, m.y + ny * len);
  const tc = m.homing ? '255,95,210' : '255,164,92';
  trail.addColorStop(0, `rgba(${tc},.55)`); trail.addColorStop(1, `rgba(${tc},0)`);
  ctx.strokeStyle = trail; ctx.lineWidth = r * 1.3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + nx * len, m.y + ny * len); ctx.stroke();

  ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.rot);
  ctx.beginPath();
  const n = m.shape.length;
  for (let i = 0; i < n; i++) {
    const a = i / n * 6.283, rr = r * m.shape[i];
    i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fillStyle = m.homing ? '#5a2346' : '#5b4637'; ctx.fill();
  ctx.strokeStyle = m.homing ? '#ff5fd2' : '#a07a5c'; ctx.lineWidth = Math.max(1.2, r * .12); ctx.stroke();
  ctx.fillStyle = m.homing ? 'rgba(255,95,210,.35)' : 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.arc(r * .25, -r * .2, r * .22, 0, 6.28); ctx.arc(-r * .3, r * .3, r * .15, 0, 6.28); ctx.fill();
  ctx.restore();
  if (m.homing && m.life > 0) {
    ctx.fillStyle = '#ff5fd2';
    ctx.beginPath(); ctx.arc(m.x, m.y, r * .28, 0, 6.28); ctx.fill();
  }
}

function drawPlayer() {
  const r = player.ru * U;
  if (hurtT > 0 && Math.floor(hurtT * 14) % 2 === 0) return;
  ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.tilt);
  // 엔진 불꽃
  const fl = r * (1.1 + Math.sin(time * 40) * .2);
  ctx.fillStyle = 'rgba(255,190,90,.9)';
  ctx.beginPath(); ctx.moveTo(-r * .35, r * .7); ctx.lineTo(0, r * .7 + fl); ctx.lineTo(r * .35, r * .7); ctx.fill();
  // 기체
  ctx.beginPath();
  ctx.moveTo(0, -r * 1.2); ctx.lineTo(r * .9, r * .85); ctx.lineTo(0, r * .5); ctx.lineTo(-r * .9, r * .85); ctx.closePath();
  const g = ctx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#8fb4ff');
  ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = '#3fd0ff'; ctx.beginPath(); ctx.ellipse(0, -r * .15, r * .22, r * .35, 0, 0, 6.28); ctx.fill();
  ctx.restore();
  if (shieldT > 0 && (shieldT > .8 || Math.floor(shieldT * 10) % 2 === 0)) {
    ctx.strokeStyle = 'rgba(63,208,255,.9)'; ctx.lineWidth = Math.max(2, U * .5);
    ctx.fillStyle = 'rgba(63,208,255,.15)';
    ctx.beginPath(); ctx.arc(player.x, player.y, r * 1.9 + Math.sin(time * 8) * U * .3, 0, 6.28); ctx.fill(); ctx.stroke();
  }
}

function drawHUD() {
  const fs = clamp(U * 3, 15, 24), pad = Math.max(14, U * 2.5), top = SAT + pad;
  ctx.textBaseline = 'top';
  // 점수
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  ctx.font = `700 ${fs}px system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif`;
  ctx.fillText(score.toLocaleString(), pad, top);
  ctx.font = `500 ${fs * .62}px system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.fillText('최고 ' + Math.max(best, score).toLocaleString(), pad, top + fs * 1.2);
  // 스테이지 + 보석 진행도
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = `700 ${fs * .8}px system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif`;
  ctx.fillText('STAGE ' + stage, W / 2, top);
  const bw = clamp(W * .26, 90, 220), bh = Math.max(6, fs * .35), bx = W / 2 - bw / 2, by = top + fs * 1.1;
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = '#7ef3ff'; ctx.fillRect(bx, by, bw * Math.min(1, gemsGot / gemsNeed), bh);
  ctx.font = `600 ${fs * .6}px system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.fillText('보석 ' + Math.min(gemsGot, gemsNeed) + ' / ' + gemsNeed, W / 2, by + bh + 4);
  // 목숨
  const hs = fs * 1.15;
  for (let i = 0; i < Math.max(3, lives); i++) drawHeart(W - pad - hs * .5 - i * hs * 1.05, top + hs * .45, hs, i < lives);
  // 데스크톱 무적 상태
  if (!document.body.classList.contains('touch')) {
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.font = `600 ${fs * .65}px system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif`;
    ctx.fillStyle = shieldT > 0 ? '#3fd0ff' : shieldCD > 0 ? 'rgba(255,255,255,.5)' : '#7ef3ff';
    ctx.fillText('Space 무적: ' + (shieldT > 0 ? '발동 중' : shieldCD > 0 ? Math.ceil(shieldCD) + '초' : '준비됨'), pad, H - pad);
  }
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#070b1a'); bg.addColorStop(1, '#141033');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.fillStyle = `rgba(255,255,255,${.25 + s.z * .6})`;
    ctx.fillRect(s.x * W, s.y * H, s.z * 2, s.z * 2);
  }
  if (shake > 0) { const k = shake * U * 4; ctx.translate(rand(-k, k), rand(-k, k)); }

  if (state !== 'menu') {
    for (const g of gems) drawGem(g);
    for (const m of meteors) drawMeteor(m);
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * U, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (state === 'play') drawPlayer();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of floats) {
      ctx.globalAlpha = 1 - f.t / 1.2; ctx.fillStyle = f.color;
      ctx.font = `700 ${clamp(U * 2.8, 14, 22)}px system-ui,-apple-system,sans-serif`;
      ctx.fillText(f.text, f.x, f.y - f.t * 6 * U);
    }
    ctx.globalAlpha = 1;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (state === 'play') {
      drawHUD();
      if (bannerT > 0) {
        ctx.globalAlpha = Math.min(1, bannerT * 2);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
        ctx.font = `800 ${clamp(U * 8, 30, 64)}px system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif`;
        ctx.fillText(banner, W / 2, H * .42);
        if (subBanner) {
          ctx.fillStyle = '#ff7fdc';
          ctx.font = `700 ${clamp(U * 3.6, 16, 28)}px system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif`;
          ctx.fillText(subBanner, W / 2, H * .42 + clamp(U * 8, 30, 64) * .9);
        }
        ctx.globalAlpha = 1;
      }
    }
  }

  // 모바일 무적 버튼 상태
  const frac = shieldCD / SHIELD_CD;
  shieldBtn.style.setProperty('--p', frac.toFixed(3));
  shieldBtn.classList.toggle('ready', shieldCD <= 0);
  const lbl = shieldT > 0 ? '발동!' : shieldCD > 0 ? Math.ceil(shieldCD) + '초' : '무적';
  if (shieldLbl.textContent !== lbl) shieldLbl.textContent = lbl;
  shieldBtn.style.visibility = state === 'play' ? 'visible' : 'hidden';
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 디버그/테스트용 (콘솔에서 상태 확인)
window.__game = { get state() { return { state, stage, score, lives, gemsGot, gemsNeed, meteors: meteors.length, homing: meteors.filter(m => m.homing).length, player: { x: player.x, y: player.y }, shieldCD, shieldT }; },
  skipStage() { gemsGot = gemsNeed; } };
})();
</script>
</body>
</html>
